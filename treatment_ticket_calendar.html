<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トリートメント回数券カレンダー生成</title>
<style>
  :root{
    --red:#f4364c; --red-d:#d61f36;
    --ink:#222; --muted:#6b7280; --line:#e5e7eb;
    --bg:#f5f6f8; --card:#fff; --field:#eef0f3;
    --ok:#1a8a4a; --warn:#b8860b; --danger:#c0392b;
    --accent:#2563eb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.6;font-size:16px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:20px 16px}
  header h1{margin:0;font-size:20px}
  header .subtitle{color:var(--muted);font-size:13px;margin-top:4px}
  main{max-width:800px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:16px;color:var(--ink)}
  .card .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
  .group{margin-bottom:18px}
  .glabel{font-weight:700;font-size:15px;margin-bottom:8px}
  .req{background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:12px;padding:2px 9px;margin-left:6px}
  input[type=text],input[type=date]{
    width:100%;padding:12px;border:1px solid transparent;background:var(--field);border-radius:10px;font-size:16px;color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);background:#fff}
  .date-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:8px}
  .date-group{display:flex;flex-direction:column}
  .date-group label{font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .date-group input[type=date]{width:100%}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--red);color:#fff}
  .btn.primary:hover{background:var(--red-d)}
  .btn.primary:disabled{background:#ccc;cursor:not-allowed}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.sm{padding:8px 14px;font-size:13px}
  .preview{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
  .preview-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .preview-item:last-child{border-bottom:none}
  .preview-label{color:var(--muted)}
  .preview-value{font-weight:600;color:var(--ink)}
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#eef2ff;border-radius:8px;margin-top:8px}
  .summary-label{font-size:13px;color:var(--muted)}
  .summary-value{font-size:18px;font-weight:700;color:var(--accent)}
  .warnbar{background:#fff7e6;border:1px solid #f0d38a;color:#7a5b00;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px;display:none}
  .warnbar.show{display:block}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:.95}
  .pricing-info{background:#f0f7f2;border:1px solid #cfe8d6;color:#1f5a34;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<header>
  <h1>トリートメント回数券カレンダー生成</h1>
  <div class="subtitle">10回コース用・Macカレンダー対応</div>
</header>

<main>
  <div class="pricing-info">
    <strong>本コース価格 20,800円（22,880円税込）</strong> ⇨ <span style="color:#c0392b;font-weight:700">3,300円off</span>・10回で<span style="color:#1a8a4a;font-weight:700">33,000円お得</span>です😃<br>
    <span style="font-size:14px;margin-top:6px;display:block">1回 17,800円×10回＝195,800円税込</span>
  </div>

  <div class="card">
    <h2>顧客情報</h2>
    <div class="group">
      <div class="glabel">顧客名 <span class="req">必須</span></div>
      <input type="text" id="customerName" placeholder="例）久保田寛" autocomplete="off">
    </div>
  </div>

  <div class="card">
    <h2>来店予定日</h2>
    <p class="hint">10回分の来店予定日を入力します。予約が決まっていない回は空欄でOK。</p>

    <div id="dateWarning" class="warnbar"></div>

    <div class="date-grid" id="dateGrid"></div>
  </div>

  <div class="card" id="previewCard" style="display:none">
    <h2>プレビュー</h2>
    <div class="preview" id="previewContent"></div>
    <div class="summary-row">
      <div class="summary-label">10回の合計金額</div>
      <div class="summary-value">¥195,800</div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnDownload">カレンダーをダウンロード（.ics）</button>
      <button class="btn ghost" id="btnReset">リセット</button>
    </div>
  </div>

  <div class="actions" id="formActions" style="display:flex">
    <button class="btn primary" id="btnGenerate">カレンダーを生成</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var DATES_KEY = "treatment_ticket_dates";
  var CUSTOMER_KEY = "treatment_ticket_customer";

  var $ = function(s) { return document.querySelector(s); };
  var $$ = function(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  function toast(msg){
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1600);
  }

  function pad(n){ return n < 10 ? "0" + n : n; }

  function formatDateJP(dateStr){
    if(!dateStr) return "（未定）";
    var date = new Date(dateStr + "T00:00:00");
    return date.getFullYear() + "年" + (date.getMonth()+1) + "月" + date.getDate() + "日（" + ["日","月","火","水","木","金","土"][date.getDay()] + "）";
  }

  function getDates(){
    var dates = {};
    for(var i=1;i<=10;i++){
      var val = $("#date"+i).value;
      if(val) dates[i] = val;
    }
    return dates;
  }

  function getDatesArray(){
    var dates = getDates();
    return dates;
  }

  function initForm(){
    // Generate date input grid
    var html = "";
    for(var i=1;i<=10;i++){
      html += '<div class="date-group">'+
        '<label>'+i+'回目</label>'+
        '<input type="date" id="date'+i+'" autocomplete="off">'+
        '</div>';
    }
    $("#dateGrid").innerHTML = html;

    // Load saved data
    var savedCustomer = localStorage.getItem(CUSTOMER_KEY);
    if(savedCustomer) $("#customerName").value = savedCustomer;

    var savedDates = localStorage.getItem(DATES_KEY);
    if(savedDates){
      try{
        var dates = JSON.parse(savedDates);
        for(var i in dates){
          var input = $("#date"+i);
          if(input) input.value = dates[i];
        }
      }catch(e){}
    }
  }

  function validate(){
    var errors = [];
    var name = $("#customerName").value.trim();
    if(!name) errors.push("顧客名を入力してください");

    var dates = getDates();
    if(Object.keys(dates).length === 0) errors.push("1回以上の来店予定日を入力してください");

    if(errors.length){
      var w = $("#dateWarning");
      w.innerHTML = "⚠ " + errors.join(" ／ ");
      w.classList.add("show");
      return false;
    }

    $("#dateWarning").classList.remove("show");
    return true;
  }

  function generatePreview(){
    var name = $("#customerName").value.trim();
    var dates = getDates();

    var html = "";
    for(var i=1;i<=10;i++){
      var dateStr = dates[i] || null;
      html += '<div class="preview-item">'+
        '<span class="preview-label">'+i+'回目</span>'+
        '<span class="preview-value">'+formatDateJP(dateStr)+'</span>'+
        '</div>';
    }

    $("#previewContent").innerHTML = html;
  }

  $("#btnGenerate").addEventListener("click", function(){
    if(!validate()) return;

    // Save to localStorage
    localStorage.setItem(CUSTOMER_KEY, $("#customerName").value.trim());
    localStorage.setItem(DATES_KEY, JSON.stringify(getDates()));

    generatePreview();
    $("#formActions").style.display = "none";
    $("#previewCard").style.display = "block";
    window.scrollTo(0, 0);
    toast("プレビューを生成しました");
  });

  $("#btnReset").addEventListener("click", function(){
    $("#formActions").style.display = "flex";
    $("#previewCard").style.display = "none";
    window.scrollTo(0, 0);
  });

  $("#btnDownload").addEventListener("click", function(){
    var name = $("#customerName").value.trim();
    var dates = getDates();

    // Generate iCalendar format
    var ics = generateICS(name, dates);

    // Download
    var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    var link = document.createElement("a");
    link.setAttribute("href", URL.createObjectURL(blob));
    link.setAttribute("download", name + "_treatment_ticket.ics");
    link.click();

    toast(name + "さんのカレンダーをダウンロードしました");
  });

  function generateICS(name, dates){
    var icsLines = [];
    icsLines.push("BEGIN:VCALENDAR");
    icsLines.push("VERSION:2.0");
    icsLines.push("PRODID:-//Treatment Ticket Calendar//EN");
    icsLines.push("CALSCALE:GREGORIAN");
    icsLines.push("METHOD:PUBLISH");
    icsLines.push("X-WR-CALNAME:" + escapeICS(name + " トリートメント10回コース"));
    icsLines.push("X-WR-TIMEZONE:Asia/Tokyo");

    // Create events for each session
    for(var i=1;i<=10;i++){
      var dateStr = dates[i];
      if(!dateStr) continue;

      var date = new Date(dateStr + "T10:00:00");
      var dtstart = formatICSDate(date);

      var endTime = new Date(date.getTime() + 60*60*1000); // 1 hour duration
      var dtend = formatICSDate(endTime);

      var summary = name + " - トリートメント" + i + "回目／全10回";
      var description = "トリートメント10回コース（1回 17,800円税込）\n";
      if(i === 10){
        description += "（最終回）10回の合計金額：195,800円\n";
      }
      description += "正規価格20,800円→17,800円に割引";

      var uid = "treatment-" + name + "-" + i + "@aromaria.github.io";

      icsLines.push("BEGIN:VEVENT");
      icsLines.push("UID:" + uid);
      icsLines.push("DTSTART:" + dtstart);
      icsLines.push("DTEND:" + dtend);
      icsLines.push("SUMMARY:" + escapeICS(summary));
      icsLines.push("DESCRIPTION:" + escapeICS(description));
      icsLines.push("LOCATION:");
      icsLines.push("STATUS:CONFIRMED");
      icsLines.push("SEQUENCE:0");
      icsLines.push("DTSTAMP:" + getCurrentICSDate());
      icsLines.push("END:VEVENT");
    }

    icsLines.push("END:VCALENDAR");
    return icsLines.join("\r\n");
  }

  function escapeICS(str){
    return String(str || "")
      .replace(/\\/g, "\\\\")
      .replace(/;/g, "\\;")
      .replace(/,/g, "\\,")
      .replace(/\r?\n/g, "\\n");
  }

  function formatICSDate(date){
    var year = date.getFullYear();
    var month = pad(date.getMonth() + 1);
    var day = pad(date.getDate());
    var hour = pad(date.getHours());
    var min = pad(date.getMinutes());
    var sec = pad(date.getSeconds());
    return year + month + day + "T" + hour + min + sec;
  }

  function getCurrentICSDate(){
    var now = new Date();
    return formatICSDate(now);
  }

  initForm();
})();
</script>
</body>
</html>
